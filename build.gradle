import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
	id "org.jetbrains.kotlin.jvm" version "2.4.20"
}

repositories {
	maven { url = 'https://api.modrinth.com/maven' }
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"mondungeons" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = 'mondungeons-tests'
		enableClientGameTests = false
	}
}
kotlin.target.compilations.named('gametest') { associateWith(kotlin.target.compilations.getByName('main')) }

// Optional development profile; RCT never becomes a packaged or required dependency.
if (providers.gradleProperty('rctCompat').map { it.toBoolean() }.getOrElse(false)) {
	repositories { mavenCentral() }
	configurations { rctCompatLibraries }
	['runtimeClasspath', 'clientRuntimeClasspath', 'gametestRuntimeClasspath'].each { name ->
		configurations.named(name) { extendsFrom configurations.rctCompatLibraries }
	}
	dependencies {
		modLocalRuntime 'maven.modrinth:rctmod:rgfBfnW9'
		modLocalRuntime 'maven.modrinth:rctapi:DoQNDXAU'
		modLocalRuntime 'maven.modrinth:architectury-api:Pzc2FP5K'
		modLocalRuntime 'maven.modrinth:forge-config-api-port:N5qzq0XV'
		rctCompatLibraries 'com.electronwill.night-config:core:3.8.0'
		rctCompatLibraries 'com.electronwill.night-config:toml:3.8.0'
	}
}
tasks.named('processGametestResources') {
	def withRct = providers.gradleProperty('rctCompat').map { it.toBoolean() }.getOrElse(false)
	inputs.property 'rctCompat', withRct
	filesMatching('fabric.mod.json') {
		expand dungeonGameTests: withRct ? '"sauceology.mondungeon.DungeonBattleGameTests", "sauceology.mondungeon.DungeonFailureGameTests", "sauceology.mondungeon.DungeonRosterGameTests"' : ''
	}
}
tasks.named('runGameTest') {
	onlyIf { providers.gradleProperty('rctCompat').map { it.toBoolean() }.getOrElse(false) }
}

dependencies {
	modImplementation "maven.modrinth:cobblemon:PdOzYHKU"
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "net.fabricmc:fabric-language-kotlin:${project.fabric_kotlin_version}"
}

// Expose Cobblemon's bundled libraries to development runs, as in custom-trainers.
configurations {
	cobblemonBundledRuntime { canBeConsumed = false; transitive = false }
}
dependencies { cobblemonBundledRuntime 'maven.modrinth:cobblemon:PdOzYHKU' }
def cobblemonRuntimeDirectory = layout.buildDirectory.dir('cobblemon-bundled-runtime')
def unpackCobblemonRuntime = tasks.register('unpackCobblemonRuntime', Sync) {
	from { zipTree(configurations.cobblemonBundledRuntime.singleFile) }
	include 'META-INF/jars/*.jar'
	exclude 'META-INF/jars/fabric-language-kotlin-*.jar'
	into cobblemonRuntimeDirectory
}
tasks.withType(JavaExec).configureEach {
	dependsOn unpackCobblemonRuntime
	classpath += fileTree(cobblemonRuntimeDirectory) { include '**/*.jar' }
	javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
	if (name == 'runGameTest') maxHeapSize = '2G'
	if (name == 'runClient' && providers.gradleProperty('raidUiPreview').isPresent()) {
		systemProperty 'mondungeons.raidUiPreview', providers.gradleProperty('raidUiPreview').get()
	}
}

tasks.register('verifyDungeonAdmission', JavaExec) {
	group = 'verification'
	description = 'Checks dungeon admission ordering and lock cleanup without launching Minecraft.'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'sauceology.mondungeon.DungeonAdmissionChecksKt'
}
tasks.named('check') { dependsOn tasks.named('verifyDungeonAdmission') }
tasks.named('test') {
	// Regression checks use the dependency-free main above, not a JUnit engine.
	dependsOn tasks.named('verifyDungeonAdmission')
	failOnNoDiscoveredTests = false
}
tasks.register('verifyDungeonRounds', JavaExec) {
	group = 'verification'
	dependsOn tasks.named('testClasses')
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'sauceology.mondungeon.DungeonRoundChecksKt'
}
tasks.named('check') { dependsOn tasks.named('verifyDungeonRounds') }

processResources {
    from('dungeon-loot.json')
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

kotlin {
	compilerOptions {
		jvmTarget = JvmTarget.JVM_21
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
